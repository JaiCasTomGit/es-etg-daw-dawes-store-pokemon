<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Eliminar Pokémon</title>
    </head>
    <body>
        <h1>Eliminar Pokémon</h1>

        <form id="deleteForm" method="POST" onsubmit="this.action='/pokemons/' + document.getElementById('pokemonId').value;">
            <input type="hidden" name="_method" value="DELETE"/>
        
            <label for="pokemonId">ID del Pokémon a eliminar:</label>
            <input type="number" id="pokemonId" placeholder="Ej: 25" required />
        
            <button type="submit">Eliminar Pokémon</button>
        </form>
    </body>
</html>
